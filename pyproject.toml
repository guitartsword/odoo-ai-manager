[project]
name = "odoo-ai-manager"
version = "0.1.0"
description = "Conocimiento, skills y herramientas seguras para trabajar con Odoo usando IA."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "openpyxl>=3.1.5",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "tzdata>=2024.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[project.scripts]
odoo-ai-manager = "odoo_ai_manager.cli:main"
odoo-pos-daily-sales = "odoo_ai_manager.modules.pos.daily_sales_report:cli_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/odoo_ai_manager"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
